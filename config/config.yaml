# Snakemake configuration for the MRIsegmentation pipeline (workflow/Snakefile)

# Tab-separated sample sheet with columns: subject, t1, t2 (t2 may be empty).
samples: config/samples.tsv

# Where per-subject outputs go: <results_dir>/<subject>/...
results_dir: results

# Which pipeline to run. Mirrors the two entry scripts in the repository root:
#   cedalion  start_segmentation_cedalion.m  (fNIRS/DOT: SPM masks, iso2mesh
#             surface + volume meshes, CAT12 cortex with Schaefer parcels, MNE export)
#   eeg       start_segmentation.m           (EEG: projectmesh surfaces, HArtMuT
#             neck-extended meshes, electrodes, sourcemodel, CTF transform, SPHARM)
pipeline: cedalion

# Optional ACPC alignment with ATRA before segmentation (needs ATRA baked into
# the image, see Dockerfile). start_segmentation.m enables it, the cedalion
# script does not. The HArtMuT artefact sourcemodel additionally requires it.
preprocessing: false

mesh:
  cedalion:
    num_vertices: 15000      # scalp / SPM cortex surface mesh vertices
    num_cortex_verts: 15000  # CAT12 cortex mesh (+ parcels) vertices
    maxvoxelvolume: 2        # max tetrahedron volume of the volume mesh (NIRFASTER)
  eeg:
    num_vertices: 1922       # vertices per BEM surface
    num_cortex_verts: 60000  # CAT12 cortex STL export (read_cat default)
    maxvoxelvolume: 2
    num_sources: 4000        # cortical sourcemodel dipoles
    spharm_degree: 50        # weighted-SPHARM degree L

container:
  # apptainer | singularity | podman | docker | none
  #   apptainer  default. Runs the image as you with your home directory, so
  #              MATLAB licenses through the MathWorks sign-in cached by the
  #              MATLAB on your host (Individual / online licensing). Build the
  #              .sif from the podman image with `bash docker/build-sif.sh`.
  #   podman/docker  need an image built with --build-arg MATLAB_LICMODE=file
  #              and MLM_LICENSE_FILE (network license, license file below) or
  #              MLM_LICENSE_TOKEN (batch licensing token) in your environment.
  #   none       runs `mriseg` from the host PATH (local install of everything).
  engine: apptainer
  # apptainer: path to the .sif (or a docker:// URL); podman/docker: image name
  image: mriseg.sif
  # User the container runs as (podman/docker only):
  #   auto     root for rootless podman (container root == host user, output
  #            files are yours without copying the image), host otherwise
  #   root | host (= $(id -u):$(id -g)) | keep-id (podman --userns=keep-id) | "uid:gid"
  user: auto
  # Extra arguments appended to `apptainer exec` / `podman run`, e.g.
  # `--security-opt label=disable` on SELinux hosts.
  extra_args: ""
  # Optional MATLAB license file to mount into the container (sets
  # MLM_LICENSE_FILE; podman/docker with MATLAB_LICMODE=file only).
  license_file: ""

resources:
  # MATLAB/SPM/CAT12 are mostly single-threaded; threads mainly limits how many
  # subjects run at once with --cores N.
  threads: 1
  mem_mb: 16000
